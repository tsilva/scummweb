version: 2
multi-ecosystem-groups:
  routine-maintenance:
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Lisbon

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: routine-maintenance
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: routine-maintenance
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
