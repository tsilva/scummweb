name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Dependency security and application gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.27.0 --activate

      - name: Install from lockfile
        run: >-
          pnpm install --filter scummweb --filter scummweb-agent-backbone
          --filter scummweb-browser-tools --frozen-lockfile --ignore-scripts

      - name: Audit dependency graph
        run: pnpm audit --audit-level=low

      - name: Check JavaScript syntax
        run: pnpm lint

      - name: Prepare the ScummVM runtime
        uses: ./.github/actions/prepare-scummvm

      - name: Restore verified artwork
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/artwork
          key: artwork-${{ runner.os }}-v1-${{ hashFiles('data/artwork-storage.json') }}
          restore-keys: artwork-${{ runner.os }}-v1-

      - name: Test
        run: |
          pnpm test
          pnpm test:backbone
          pnpm test:browser-tools

      - name: Build production application
        run: pnpm build

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
