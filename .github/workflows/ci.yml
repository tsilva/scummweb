name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    uses: tsilva/.github/.github/workflows/node-pnpm-ci.yml@main
    with:
      node-version: "22"
      workspace-filters: |
        scummweb
        scummweb-agent-backbone
        scummweb-browser-tools
      timeout-minutes: 90

  application-check:
    name: Dependency security and application gates
    needs: application
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful application checks
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
        run: test "$APPLICATION_RESULT" = success

  review-dependencies:
    uses: tsilva/.github/.github/workflows/dependency-review.yml@main

  dependency-review:
    name: Dependency review
    needs: review-dependencies
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful dependency review
        env:
          REVIEW_RESULT: ${{ needs.review-dependencies.result }}
        run: test "$REVIEW_RESULT" = success
