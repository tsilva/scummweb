name: Stage prebuilt deployment

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      promote:
        description: Promote the verified deployment to the production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scummweb-prebuilt-delivery
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_eE2Iv7IMqPOx8ZVN2xNfR2f0
  VERCEL_PROJECT_ID: prj_I5MH0YVxKnamBHxfmq46QAVANJkt

jobs:
  stage:
    if: >-
      github.ref == 'refs/heads/main' &&
      (!inputs.promote || github.workflow_ref == 'tsilva/scummweb/.github/workflows/production-delivery.yml@refs/heads/main')
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the pinned Vercel CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-save --ignore-scripts --min-release-age=7 vercel@65.4.0
          echo "$RUNNER_TEMP/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      - name: Read project settings and public build configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          vercel api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" |
            jq -e --arg project "$VERCEL_PROJECT_ID" --arg team "$VERCEL_ORG_ID" '
              select(.id == $project and .accountId == $team and .name == "scummweb"
                and .framework == "nextjs" and .rootDirectory == null and .nodeVersion == "24.x")
              | {projectId: .id, orgId: .accountId, projectName: .name,
                 settings: {framework, nodeVersion, buildCommand, installCommand, outputDirectory,
                            rootDirectory, directoryListing, analyticsId}}
            ' > .vercel/project.json
          dsn_id=$(vercel api "/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" |
            jq -er '[.envs[] | select(.key == "NEXT_PUBLIC_SENTRY_DSN" and .type == "encrypted"
              and .target == ["production"] and .gitBranch == null)] | select(length == 1)
              | .[0].id | select(test("^[a-zA-Z0-9_-]+$"))')
          vercel api "/v1/projects/$VERCEL_PROJECT_ID/env/$dsn_id?teamId=$VERCEL_ORG_ID" |
            jq -er 'select(.key == "NEXT_PUBLIC_SENTRY_DSN") | .value
              | select(test("^https://[a-f0-9]+@[^/[:space:]]+\\.sentry\\.io/[0-9]+$"))
              | "NEXT_PUBLIC_SENTRY_DSN=" + .' >> "$GITHUB_ENV"

      - name: Restore social cards
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache/scummweb-social-cards
          key: scummweb-social-cards-linux-v1-${{ github.sha }}
          restore-keys: scummweb-social-cards-linux-v1-

      - name: Install application dependencies from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the Vercel artifact
        env:
          VERCEL_ENV: production
          VERCEL_TARGET_ENV: production
          SCUMMVM_ASSET_VERSION: ${{ github.sha }}
          SCUMMWEB_DEPLOYMENT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          REQUIRE_SOURCE_MAPS: ${{ inputs.promote || false }}
          SENTRY_AUTH_TOKEN: ${{ inputs.promote && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRE_SOURCE_MAPS" == true ]]; then
            test -n "$SENTRY_AUTH_TOKEN" || { echo 'Missing Production SENTRY_AUTH_TOKEN' >&2; exit 1; }
            vercel build --prod --non-interactive 2>&1 | awk '
              { print }
              /Successfully uploaded source maps to Sentry/ { uploaded=1 }
              END { if (!uploaded) { print "Sentry source map upload was not confirmed" > "/dev/stderr"; exit 1 } }
            '
          else
            vercel build --prod --non-interactive
          fi
          test -s .vercel/output/config.json
          jq -e --arg id "$SCUMMWEB_DEPLOYMENT_ID" '.deploymentId == $id' .vercel/output/config.json
          test -f .vercel/output/static/scummvm.html

      - name: Stage the artifact without assigning production domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          result=$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --yes --non-interactive \
            --meta "scummwebBuildCommit=$GITHUB_SHA" \
            --meta "scummwebBuildRun=$GITHUB_RUN_ID")
          deployment_url=$(jq -er 'select(.status == "ok") | .deployment.url' <<< "$result")
          deployment_id=$(jq -er 'select(.status == "ok") | .deployment.id' <<< "$result")
          [[ "$deployment_url" =~ ^https://scummweb-[a-z0-9-]+-tsilvas-projects\.vercel\.app$ ]]
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
          printf '%s\n\n%s\n' "Staged prebuilt deployment for $GITHUB_SHA" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the staged deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: python3 scripts/verify-prebuilt-deployment.py "$DEPLOYMENT_URL" "$DEPLOYMENT_ID"

      - name: Promote the verified deployment
        if: inputs.promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          current_main=$(gh api repos/tsilva/scummweb/git/ref/heads/main --jq .object.sha)
          test "$current_main" = "$GITHUB_SHA" || { echo 'A newer commit is on main' >&2; exit 1; }
          vercel promote "$DEPLOYMENT_ID" --yes --non-interactive
          vercel api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" |
            jq -e --arg id "$DEPLOYMENT_ID" '.targets.production.id == $id
              and (.targets.production.alias | index("scummweb.tsilva.eu") != null)'
