name: Secret scanning

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      full_history:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan all Git history instead of the current files
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    uses: tsilva/.github/.github/workflows/secret-scanning.yml@main
    with:
      full_history: ${{ inputs.full_history || false }}
