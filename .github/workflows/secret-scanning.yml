name: Secret scanning

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      full_history:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan all Git history instead of the current files
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Infisical CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infisical-bin"
          curl --fail --silent --show-error --location \
            https://github.com/Infisical/cli/releases/download/v0.43.138/cli_0.43.138_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/infisical-cli.tar.gz"
          echo "45a98380964650e4cc2b57ff5361d174afb55b3daf7c2465640d3a7bb7550f92  $RUNNER_TEMP/infisical-cli.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/infisical-cli.tar.gz" -C "$RUNNER_TEMP/infisical-bin" infisical
          echo "$RUNNER_TEMP/infisical-bin" >> "$GITHUB_PATH"
      - name: Scan without exporting credentials or matched content
        shell: bash
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_FULL_HISTORY: ${{ inputs.full_history || false }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          def revision(value):
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise ValueError("Invalid scan revision")
              subprocess.run(["git", "cat-file", "-e", value + "^{commit}"],
                             check=True, capture_output=True)
              return value

          try:
              with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
                  root = pathlib.Path(temporary)
                  report = root / "report.json"
                  config = root / "scanner.toml"
                  config.write_text('[extend]\nuseDefault = true\n')
                  command = ["infisical", "scan", "--source=.", "--redact",
                             "--no-color", "--telemetry=false", "--silent",
                             "--config=" + str(config), "--report-format=json",
                             "--report-path=" + str(report)]
                  head = revision(os.environ["SCAN_HEAD"])
                  if os.environ.get("SCAN_FULL_HISTORY") == "true":
                      scope = "Full Git history"
                      command.append("--log-opts=--all")
                  elif os.environ["SCAN_EVENT"] in {"push", "pull_request"}:
                      base = os.environ.get("SCAN_BASE", "")
                      if base == "0" * 40:
                          scope = "New branch history"
                          command.append("--log-opts=" + head)
                      else:
                          base = revision(base)
                          scope = "Changed commits"
                          command.append("--log-opts=" + base + ".." + head)
                  else:
                      scope = "Current checked-out files"
                      command.append("--no-git")
                  result = subprocess.run(command, capture_output=True, timeout=900)
                  # Never print scanner output or upload its raw report: both can
                  # contain source content even when matched values are redacted.
                  findings = json.loads(report.read_text())
                  if not isinstance(findings, list) or result.returncode not in {0, 1}:
                      raise ValueError("Scanner did not complete successfully")
                  if bool(findings) != (result.returncode == 1):
                      raise ValueError("Scanner status and report disagree")
                  summary = ["## Secret scanning", "", scope + ": " + str(len(findings)) + " findings.", ""]
                  if findings:
                      summary += ["Rotate exposed credentials and remove them from source. Review test fixtures individually; do not baseline real leaks.", "", "| File | Line | Rule | Commit |", "| --- | --- | --- | --- |"]
                  for item in findings[:100]:
                      # Whitelist location metadata; omit Secret, Match, authors,
                      # messages, and source snippets from every published result.
                      file = html.escape(str(item.get("File", ""))[:240]).replace("|", "&#124;").replace("\n", " ").replace("\r", " ")
                      rule = str(item.get("RuleID", ""))
                      if not re.fullmatch(r"[a-zA-Z0-9_-]{1,100}", rule):
                          rule = "unknown"
                      commit = str(item.get("Commit", ""))
                      commit = commit[:12] if re.fullmatch(r"[0-9a-f]{40}", commit) else "working tree"
                      line = item.get("StartLine", 0)
                      line = line if isinstance(line, int) and line >= 0 else 0
                      summary.append(f"| {file} | {line} | {rule} | {commit} |")
                  if len(findings) > 100:
                      summary.append("Additional findings omitted; run the redacted CLI scan locally to review all locations.")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                      stream.write("\n".join(summary) + "\n")
                  print(scope + ": " + str(len(findings)) + " findings; see the job summary for locations.")
                  sys.exit(1 if findings else 0)
          except (OSError, ValueError, subprocess.SubprocessError, KeyError):
              print("::error::Secret scanning failed to complete. No source content was printed. Retry manually or inspect the scanner configuration.")
              sys.exit(2)
          PY
