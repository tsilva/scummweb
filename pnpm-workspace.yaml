packages:
  - agent-backbone

minimumReleaseAge: 2880
blockExoticSubdeps: true
allowBuilds:
  '@sentry/cli': set this to true or false
  sharp: set this to true or false

overrides:
  '@sentry/bundler-plugin-core@5.3.0>glob': 14.0.2
  '@sentry/bundler-plugins@10.69.0>glob': 14.0.2
  '@sentry/bundler-plugins@11.10.0>glob': 14.0.2
  'glob@14.0.2>path-scurry': 3.0.0
  'minimatch@11.0.1>@isaacs/nonrecursive-glob-match': 1.0.1
  'minimatch': 11.0.1
  "fast-uri": "3.1.9"
  source-map-js: 1.2.2
  brace-expansion: 5.0.12
  # Patched callers use minimatch; fdir receives an explicit matcher.
  # Keep CommonJS on the patched pluginutils when Dependabot refreshes Sentry.
  '@rollup/plugin-commonjs@28.0.1>@rollup/pluginutils': 5.4.0
  '@rollup/plugin-commonjs@28.0.1>picomatch': '-'
  '@rollup/pluginutils@5.4.0>picomatch': '-'
  'fdir@6.5.0>picomatch': '-'

packageExtensions:
  '@rollup/plugin-commonjs@28.0.1':
    dependencies:
      minimatch: 11.0.1
  '@rollup/pluginutils@5.4.0':
    dependencies:
      minimatch: 11.0.1

patchedDependencies:
  '@rollup/plugin-commonjs@28.0.1': patches/dependencies/@rollup__plugin-commonjs@28.0.1.patch
  '@rollup/pluginutils@5.4.0': patches/dependencies/@rollup__pluginutils@5.4.0.patch
