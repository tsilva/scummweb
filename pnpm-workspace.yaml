minimumReleaseAge: 10080
blockExoticSubdeps: true
allowBuilds:
  '@sentry/cli': set this to true or false
  sharp: set this to true or false

overrides:
  '@sentry/bundler-plugin-core@5.3.0>glob': 14.0.2
  '@sentry/bundler-plugins@10.69.0>glob': 14.0.2
  '@sentry/bundler-plugins@11.10.0>glob': 14.0.2
  'glob@14.0.2>path-scurry': 3.0.0
  'minimatch@11.0.1>@isaacs/nonrecursive-glob-match': 1.0.1
  'minimatch': 11.0.1
  "fast-uri": "3.1.9"
  source-map-js: 1.2.2
  brace-expansion: 5.0.12

