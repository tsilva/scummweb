# English DOS CD 1.1.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/gk2-dos-1.1/src
# endChapter advances gChapter. The final furnace scene has its own losing branches.
# endGameRm reaches room 92 after the successful furnace sequence. endChapter can also reach 92 after chapter six.
schema_version: 1
game: the-beast-within-a-gabriel-knight-mystery
engine_id: sci
edition:
  game_id: gk2
  index_md5: b527742646e358218b5861ac392a604d
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  furnace: 1300
  ending: 92
variables:
  chapter: { bank: globals, index: 115 }
  previous-room: { bank: globals, index: 12 }
flags:
  # Saved MSB-first n011 awards. Chapter initialization seeds other flag ranges.
  read-hubers-note: { bank: globals, index: 201, mask: 0x0040 } # 825, rm2142
  examined-hunt-trophies: { bank: globals, index: 208, mask: 0x0040 } # 937, rm4612
  examined-occult-symbols: { bank: globals, index: 208, mask: 0x0020 } # 938, rm4612
  combined-recorder-and-magazine: { bank: globals, index: 211, mask: 0x8000 } # 976, invInitCode
  played-tour-stop-910: { bank: globals, index: 211, mask: 0x0008 } # 988, rm910
  played-tour-stop-920: { bank: globals, index: 211, mask: 0x0004 } # 989, rm920
  played-tour-stop-940: { bank: globals, index: 211, mask: 0x0002 } # 990, rm940
  played-tour-stop-950: { bank: globals, index: 211, mask: 0x0001 } # 991, rm950
  played-tour-stop-960: { bank: globals, index: 212, mask: 0x8000 } # 992, rm960
  played-tour-stop-930: { bank: globals, index: 212, mask: 0x4000 } # 993, rm930
  played-tour-stop-970: { bank: globals, index: 212, mask: 0x2000 } # 994, rm970
  examined-wahnfried-plaque: { bank: globals, index: 213, mask: 0x0008 } # 1020, wahnRPlaque
  read-diary-translation: { bank: globals, index: 213, mask: 0x0001 } # 1023, invInitCode
milestones:
  - id: reached-chapter-2
    label: Reached chapter 2
    when: { variable: chapter, equals: 2 }
  - id: reached-chapter-3
    label: Reached chapter 3
    when: { variable: chapter, equals: 3 }
  - id: reached-chapter-4
    label: Reached chapter 4
    when: { variable: chapter, equals: 4 }
  - id: reached-chapter-5
    label: Reached chapter 5
    when: { variable: chapter, equals: 5 }
  - id: reached-chapter-6
    label: Reached chapter 6
    when: { variable: chapter, equals: 6 }
  - id: reached-furnace
    label: Reached the theater furnace room
    when: { room: furnace }
  - id: read-hubers-note
    label: Read Huber’s note
    when: { flag: read-hubers-note }
  - id: examined-hunt-trophies
    label: Examined the Hunt Club basement trophies
    when: { flag: examined-hunt-trophies }
  - id: examined-occult-symbols
    label: Examined the occult symbols
    when: { flag: examined-occult-symbols }
  - id: combined-recorder-and-magazine
    label: Combined the tape recorder and magazine
    when: { flag: combined-recorder-and-magazine }
  - id: played-tour-stop-910
    label: Played the entry hall tour recording
    when: { flag: played-tour-stop-910 }
  - id: played-tour-stop-920
    label: Played the bedroom tour recording
    when: { flag: played-tour-stop-920 }
  - id: played-tour-stop-940
    label: Played the chapel tour recording
    when: { flag: played-tour-stop-940 }
  - id: played-tour-stop-950
    label: Played the living room tour recording
    when: { flag: played-tour-stop-950 }
  - id: played-tour-stop-960
    label: Played the grotto tour recording
    when: { flag: played-tour-stop-960 }
  - id: played-tour-stop-930
    label: Played the study tour recording
    when: { flag: played-tour-stop-930 }
  - id: played-tour-stop-970
    label: Played the Singer’s Hall tour recording
    when: { flag: played-tour-stop-970 }
  - id: examined-wahnfried-plaque
    label: Examined the Wahnfried plaque
    when: { flag: examined-wahnfried-plaque }
  - id: read-diary-translation
    label: Read the diary translation
    when: { flag: read-diary-translation }
  - id: winning-ending
    label: Defeated Von Glower
    when: { all: [{ room: ending }, { any: [{ variable: previous-room, equals: 1300 }, { all: [{ variable: previous-room, equals: 12 }, { variable: chapter, equals: 7 }] }] }] }
