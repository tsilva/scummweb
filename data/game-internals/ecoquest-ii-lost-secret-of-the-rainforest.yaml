# English DOS 1.000.000.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/eco2-dos-1.000.000/src
schema_version: 1
game: ecoquest-ii-lost-secret-of-the-rainforest
engine_id: sci
edition:
  game_id: ecoquest2
  index_md5: d0b627359fa855fcdec5f17c8e00d65c
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  forest-heart: 420 # Script 400 goToHeart enters room 420.
  camp-escape: 530 # Script 500 sEscapeWithRope enters 530.
  rainforest-village: 880 # Script 860 eagle sequence enters room 880, where Adam can replant Forest Heart.
  ending: 890 # Room 880 finishes the story and enters the credits in room 890.
variables:
  score: { bank: globals, index: 15 }
  previous-room: { bank: globals, index: 12 } # SCI previous room global.
flags:
  # Main.points uses a saved MSB-first flag bank. The low flags reused in several areas are omitted.
  played-drums: { bank: globals, index: 112, mask: 0x0004 } # 45, inDrums
  swung-across: { bank: globals, index: 113, mask: 0x0080 } # 56, rm360
  swung-back: { bank: globals, index: 113, mask: 0x0040 } # 57, rm360
  used-drum-stand: { bank: globals, index: 113, mask: 0x0010 } # 59, rm330
  used-paint-pot: { bank: globals, index: 113, mask: 0x0008 } # 60, rm380
  helped-baby: { bank: globals, index: 114, mask: 0x0008 } # 76, rm300
  first-tarzan-encounter: { bank: globals, index: 114, mask: 0x0004 } # 77, rm360
  second-tarzan-encounter: { bank: globals, index: 114, mask: 0x0002 } # 78, rm360
  helped-chiropterus: { bank: globals, index: 111, mask: 0x4000 } # 17, rm630
  used-rod: { bank: globals, index: 111, mask: 0x2000 } # 18, rm630
milestones:
  - id: forest-heart
    label: "Reached Forest Heart"
    when: { room: forest-heart }
  - id: camp-escape
    label: "Escaped the camp"
    when: { room: camp-escape }
  - id: rainforest-village
    label: "Returned to the village"
    when: { room: rainforest-village }
  - id: played-drums
    label: Played the drums
    when: { flag: played-drums }
  - id: swung-across
    label: Swung across on the vine
    when: { flag: swung-across }
  - id: swung-back
    label: Swung back across the river
    when: { flag: swung-back }
  - id: used-drum-stand
    label: Used the drum stand
    when: { flag: used-drum-stand }
  - id: used-paint-pot
    label: Used the paint pot
    when: { flag: used-paint-pot }
  - id: helped-baby
    label: Helped the baby
    when: { flag: helped-baby }
  - id: first-tarzan-encounter
    label: Completed the first Tarzan interaction
    when: { flag: first-tarzan-encounter }
  - id: second-tarzan-encounter
    label: Completed the second Tarzan interaction
    when: { flag: second-tarzan-encounter }
  - id: helped-chiropterus
    label: Helped Chiropterus
    when: { flag: helped-chiropterus }
  - id: used-rod
    label: Used the rod
    when: { flag: used-rod }
  - id: winning-ending
    label: "Restored Forest Heart and reached the credits"
    implies: [rainforest-village]
    when: { all: [{ room: ending }, { variable: previous-room, equals: 880 }] }
