# English DOS VGA CD.
# Native evidence: scripts and room directory from the detected edition.
# Scripts 122, 107 and 131 transition through chapter cards 97, 98 and 95.
# Script 151 enters the ending room and starts script 138 after the church confrontation.
schema_version: 1
game: the-secret-of-monkey-island
engine_id: scumm
edition:
  game_id: monkey
  index_md5: 2d1e891fe52df707c30185e52c50cd92
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  sea-monkey-cabin: 7
  sea-monkey-hold: 8
  sea-monkey-between-decks: 9
  sea-monkey-deck: 19
  journey: 97
  monkey-island: 98
  final-chapter: 95
  epilogue: 89
variables:
  ending-script: { bank: running_scripts, index: 138 }
objects:
  herman-s-memo: 272 # Room 20 entry gives it after script 107; pickup sets state 1.
flags:
  # Script 71 sets bit 83 + trial number at the actual objective, before reporting back.
  sword-trial-done: { bank: scumm_bit_bytes, index: 10, mask: 0x10 } # Bit 84, script 116.
  theft-trial-done: { bank: scumm_bit_bytes, index: 10, mask: 0x20 } # Bit 85, room 42 script 200.
  treasure-trial-done: { bank: scumm_bit_bytes, index: 10, mask: 0x40 } # Bit 86, room 64 script 200.
  bought-sea-monkey: { bank: scumm_bit_bytes, index: 6, mask: 0x08 } # Bit 51, script 56.
  freed-otis: { bank: scumm_bit_bytes, index: 9, mask: 0x10 } # Bit 76, script 70.
  recruited-meathook: { bank: scumm_bit_bytes, index: 11, mask: 0x01 } # Bit 88, room 37 script 205.
  recruited-carla: { bank: scumm_bit_bytes, index: 11, mask: 0x02 } # Bit 89, scripts 64 and 139.
  reached-island: { bank: scumm_bit_bytes, index: 49, mask: 0x40 } # Bit 398 is cleared on the beach.
  returned-to-melee: { bank: scumm_bit_bytes, index: 56, mask: 0x20 }
milestones:
  - id: completed-sword-trial
    label: Defeated the Sword Master
    when: { flag: sword-trial-done }
  - id: completed-theft-trial
    label: Stole the Idol of Many Hands
    when: { flag: theft-trial-done }
  - id: completed-treasure-trial
    label: Dug up the lost treasure of Mêlée Island
    when: { flag: treasure-trial-done }
  - id: bought-sea-monkey
    label: Bought the Sea Monkey
    when: { flag: bought-sea-monkey }
  - id: freed-otis
    label: Freed Otis from jail
    when: { flag: freed-otis }
  - id: recruited-meathook
    label: Recruited Meathook
    when: { flag: recruited-meathook }
  - id: recruited-carla
    label: Recruited Carla
    when: { flag: recruited-carla }
  - id: departed-melee
    label: Finished the trials and sailed from Mêlée Island
    when:
      any:
        - { room: journey }
        - { room: sea-monkey-deck }
        - { room: sea-monkey-cabin }
        - { room: sea-monkey-hold }
        - { room: sea-monkey-between-decks }
    # Room 35 exit 450 requires all three trials, the ship, and the three crew flags.
    implies: [completed-sword-trial, completed-theft-trial, completed-treasure-trial, bought-sea-monkey, freed-otis, recruited-meathook, recruited-carla]
  - id: reached-monkey-island
    label: Reached Monkey Island
    when: { any: [{ room: monkey-island }, { flag: reached-island }, { object: herman-s-memo, equals: 1 }] }
    implies: [departed-melee]
  - id: returned-to-melee
    label: Returned to Mêlée Island to confront LeChuck
    when: { any: [{ room: final-chapter }, { flag: returned-to-melee }] }
    implies: [reached-monkey-island]
  - id: winning-ending
    label: Defeated LeChuck
    when: { all: [{ room: epilogue }, { variable: ending-script, equals: 1 }] }
