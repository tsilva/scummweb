# English DOS VGA CD.
# Native evidence: scripts and room directory from the detected edition.
# Scripts 122, 107 and 131 transition through chapter cards 97, 98 and 95.
# Script 151 enters the ending room and starts script 138 after the church confrontation.
schema_version: 1
game: the-secret-of-monkey-island
engine_id: scumm
edition:
  game_id: monkey
  index_md5: 2d1e891fe52df707c30185e52c50cd92
telemetry: snapshot
scoring: highest_stage
rooms:
  journey: 97
  monkey-island: 98
  final-chapter: 95
  epilogue: 89
variables:
  ending-script: { bank: running_scripts, index: 138 }
flags:
  reached-island: { bank: scumm_bit_bytes, index: 49, mask: 0x40 }
  returned-to-melee: { bank: scumm_bit_bytes, index: 56, mask: 0x20 }
milestones:
  - id: departed-melee
    label: Finished the trials and sailed from Mêlée Island
    when: { any: [{ room: journey }, { room_id: 19 }] }
  - id: reached-monkey-island
    label: Reached Monkey Island
    when: { any: [{ room: monkey-island }, { flag: reached-island }] }
  - id: returned-to-melee
    label: Returned to Mêlée Island to confront LeChuck
    when: { any: [{ room: final-chapter }, { flag: returned-to-melee }] }
  - id: winning-ending
    label: Defeated LeChuck
    when: { all: [{ room: epilogue }, { variable: ending-script, equals: 1 }] }
