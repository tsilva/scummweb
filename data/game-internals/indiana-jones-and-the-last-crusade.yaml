schema_version: 1
game: indiana-jones-and-the-last-crusade
engine_id: scumm
edition:
  game_id: indy3
  # English Amiga/EGA index.
  index_md5: 9c0fee288ad564a7d25ec3e841810d79
scoring: highest_stage
rooms:
  castle-brunwald: 12
  castle-interior: 13
  venice-library-entrance: 16
  venice-library-shelves: 17
  venice-library-floor: 18
  airport-terminal: 35
  airport-airfield: 36
  ending-credits: 94
variables:
  ending-outcome: { bank: scumm_vars, index: 99 }
flags:
  diary-unwrapped: { bank: scumm_vars, index: 93, mask: 0x8000 }
  catacombs-entered: { bank: scumm_vars, index: 94, mask: 0x0040 }
  catacomb-wooden-door-opened: { bank: scumm_vars, index: 95, mask: 0x0200 }
  shield-clue-read: { bank: scumm_vars, index: 94, mask: 0x0080 }
  found-henry: { bank: scumm_vars, index: 92, mask: 0x2000 }
  henry-out-of-cell: { bank: scumm_vars, index: 92, mask: 0x8000 }
  resumed-overland-escape: { bank: scumm_vars, index: 93, mask: 0x0400 }
  grail-temple-reached: { bank: scumm_vars, index: 93, mask: 0x4000 }
  trials-passage-opened: { bank: scumm_vars, index: 93, mask: 0x0200 }
  passed-first-trial: { bank: scumm_vars, index: 95, mask: 0x0001 }
  passed-second-trial: { bank: scumm_vars, index: 95, mask: 0x0002 }
  true-grail-chosen: { bank: scumm_vars, index: 94, mask: 0x0001 }
  left-barnett: { bank: scumm_vars, index: 94, mask: 0x0020 }
  grail-knight-reached: { bank: scumm_vars, index: 95, mask: 0x0004 }
  henry-healing-started: { bank: scumm_vars, index: 95, mask: 0x0008 }
objects:
  castle-entrance: 156
milestones:
  - id: opened-grail-diary
    label: Unwrapped Henry's Grail Diary
    when: { flag: diary-unwrapped }
  - id: departed-barnett
    label: Left Barnett for the Grail search
    when: { flag: left-barnett }
  - id: venice-library
    label: Reached the Venice library
    when:
      any:
        - { room: venice-library-entrance }
        - { room: venice-library-shelves }
        - { room: venice-library-floor }
  - id: venice-catacombs
    label: Entered the Venice catacombs
    when: { flag: catacombs-entered }
  - id: opened-catacomb-wooden-door
    label: Unlatched the wooden door in the catacombs
    when: { flag: catacomb-wooden-door-opened }
  - id: read-venice-shield
    label: Read the Iskenderun clue on the shield
    when: { flag: shield-clue-read }
  - id: castle-brunwald
    label: Reached Castle Brunwald
    when:
      any:
        - { room: castle-brunwald }
        - { object: castle-entrance, equals: 1 }
  - id: inside-castle
    label: Got inside Castle Brunwald
    when: { room: castle-interior }
  - id: found-henry
    label: Found Henry in the castle
    when: { flag: found-henry }
  - id: henry-out-of-cell
    label: Got Henry out of his cell
    when: { flag: henry-out-of-cell }
  - id: reached-airport
    label: Reached the airport after leaving the castle
    when:
      any:
        - { room: airport-terminal }
        - { room: airport-airfield }
  - id: resumed-overland-escape
    label: Reunited with Henry after the plane crash
    when: { flag: resumed-overland-escape }
  - id: grail-temple
    label: Reached the Grail Temple
    when: { flag: grail-temple-reached }
  - id: opened-trials-passage
    label: Opened the passage to the Grail trials
    when: { flag: trials-passage-opened }
  - id: passed-first-trial
    label: Passed the first Grail trial
    when: { flag: passed-first-trial }
  - id: passed-second-trial
    label: Passed the second Grail trial
    when: { flag: passed-second-trial }
  - id: grail-knight
    label: Passed the trials and reached the Grail Knight
    when: { flag: grail-knight-reached }
  - id: chose-grail
    label: Chose the true Grail
    when:
      all:
        - { flag: grail-knight-reached }
        - { flag: true-grail-chosen }
  - id: true-grail
    label: Chose the true Grail and returned to Henry
    when:
      all:
        - { flag: true-grail-chosen }
        - { flag: henry-healing-started }
  - id: surviving-ending
    label: Reached the ending with Indy alive
    when:
      all:
        - { room: ending-credits }
        # Outcome 2 also enters the credits after Indy dies at the seal.
        - { variable: ending-outcome, one_of: [1, 3, 4] }
        - { milestone: true-grail }
