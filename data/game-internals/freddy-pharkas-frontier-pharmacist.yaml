  - id: third-act
    label: "Reached the third act"
    when: { room: third-act }
  - id: showdown
    label: "Reached the final showdown"
    when: { room: showdown }
  - id: winning-ending
    label: "Reached the ending credits"
    when: { all: [{ room: ending }, { variable: previous-room, equals: 170 }] }
