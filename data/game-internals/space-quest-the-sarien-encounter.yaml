# English Amiga 1.2.
# Traced against the original AGI logic resources for this edition.
# Logic 64 begins the victory ceremony whether or not Roger kept the data cartridge.
schema_version: 1
game: space-quest-the-sarien-encounter
engine_id: agi
edition:
  game_id: sq1
  index_md5: 0b216d931e95750f1f4837d6a4b821e5
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  kerona-crash-site: 12
  deltaur-approach: 43
  xenon-awards: 64
  arcada-escape-pod: 10 # Logic 10 contains the Arcada escape-pod controls.
  ulence-flats: 35 # Logic 35 handles the skimmer sale and ship purchases.
  deltaur-sighting: 41 # Logic 41 confirms the Deltaur before transitioning to room 43.
  deltaur-escape: 63 # Logic 63 shows the destruction of the Deltaur before the ceremony.
variables:
  score: { bank: vars, index: 3 }
  previous-room: { bank: vars, index: 1 }
flags:
  pod-autopilot: { bank: flag_bytes, index: 10, mask: 0x02 } # 81, logic 10
  read-cartridge: { bank: flag_bytes, index: 22, mask: 0x08 } # 179, logic 31
  recovered-cartridge: { bank: flag_bytes, index: 22, mask: 0x10 } # 180, logic 31
  disabled-force-field: { bank: flag_bytes, index: 26, mask: 0x01 } # 208, logic 50
milestones:
  - id: arcada-escape-pod
    label: "Entered the Arcada’s escape pod"
    when: { room: arcada-escape-pod }
  - id: pod-autopilot
    label: Engaged the escape pod’s autopilot
    implies: [arcada-escape-pod]
    when: { flag: pod-autopilot }
  - id: reached-kerona
    label: Reached Kerona
    when: { room: kerona-crash-site }
  - id: read-cartridge
    label: Loaded the data cartridge in the Kerona console
    when: { flag: read-cartridge }
  - id: recovered-cartridge
    label: Took the data cartridge back from the Kerona console
    implies: [read-cartridge]
    when: { flag: recovered-cartridge }
  - id: ulence-flats
    label: "Reached Ulence Flats"
    when: { room: ulence-flats }
  - id: deltaur-sighting
    label: "Sighted the Deltaur"
    when: { room: deltaur-sighting }
  - id: reached-deltaur
    label: Reached the Deltaur
    when: { room: deltaur-approach }
  - id: disabled-force-field
    label: Disabled the Star Generator’s force field
    when: { flag: disabled-force-field }
  - id: deltaur-escape
    label: "Escaped the Deltaur"
    when: { room: deltaur-escape }
  - id: winning-ending
    label: Reached the Xenon awards ceremony
    implies: [deltaur-escape, reached-deltaur]
    when: { all: [{ room: xenon-awards }, { variable: previous-room, equals: 63 }] }
