# English DOS CD high resolution 1.000.000.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/lsl6-hires-dos-1.000.000/src
schema_version: 1
game: leisure-suit-larry-6-shape-up-or-slip-out
engine_id: sci
edition:
  game_id: lsl6hires
  index_md5: 278d4b7b548a805ba5fbfaea04d61d63
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  flowers: 620 # Script 380 ends its cartoon in 620, which contains the flower and carpet sequence.
  shamara: 720 # Room 720 contains itemOnShamScr and endOfGameScr.
  ending: 740 # Script 720 endOfGameScr advances to the fireworks and end message.
variables:
  score: { bank: globals, index: 15 }
  previous-room: { bank: globals, index: 12 } # SCI previous room global.
  shamara-gifts: { bank: globals, index: 175 } # rm720 increments after each gift.
milestones:
  - id: flowers
    label: "Reached the bungee platform"
    when: { room: flowers }
  - id: shamara
    label: "Reached Shamara’s final sequence"
    when: { any: [{ room: shamara }, { variable: shamara-gifts, one_of: [1, 2, 3, 4, 5, 6, 7, 8] }] }
  - id: given-gifts-1
    label: Gave Shamara 1 gift
    when: { variable: shamara-gifts, one_of: [1, 2, 3, 4, 5, 6, 7, 8] }
  - id: given-gifts-2
    label: Gave Shamara 2 gifts
    when: { variable: shamara-gifts, one_of: [2, 3, 4, 5, 6, 7, 8] }
  - id: given-gifts-3
    label: Gave Shamara 3 gifts
    when: { variable: shamara-gifts, one_of: [3, 4, 5, 6, 7, 8] }
  - id: given-gifts-4
    label: Gave Shamara 4 gifts
    when: { variable: shamara-gifts, one_of: [4, 5, 6, 7, 8] }
  - id: given-gifts-5
    label: Gave Shamara 5 gifts
    when: { variable: shamara-gifts, one_of: [5, 6, 7, 8] }
  - id: given-gifts-6
    label: Gave Shamara 6 gifts
    when: { variable: shamara-gifts, one_of: [6, 7, 8] }
  - id: given-gifts-7
    label: Gave Shamara 7 gifts
    when: { variable: shamara-gifts, one_of: [7, 8] }
  - id: given-gifts-8
    label: Gave Shamara 8 gifts
    when: { variable: shamara-gifts, equals: 8 }
  - id: winning-ending
    label: "Reached the finale"
    when: { all: [{ room: ending }, { variable: previous-room, equals: 720 }] }
