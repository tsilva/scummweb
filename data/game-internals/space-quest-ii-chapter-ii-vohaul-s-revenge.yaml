# English DOS 2.0F.
# Traced against the original AGI logic resources for this edition.
# Logic 95 shares the epilogue room with failures and shows the winning message only with flag 68.
schema_version: 1
game: space-quest-ii-chapter-ii-vohaul-s-revenge
engine_id: agi
edition:
  game_id: sq2
  index_md5: 28add5125484302d213911df60d2aded
telemetry: snapshot
scoring: highest_stage
rooms:
  asteroid-approach: 46
  clone-launch-controls: 86
  epilogue: 95
  labion-landing: 8 # Logic 8 opens the shuttle hatch and sends Roger to room 46.
  vohaul-jar: 87 # Logic 86 sends Roger to 87 after miniaturizing him.
variables:
  score: { bank: vars, index: 3 }
  max-score: { bank: vars, index: 7 }
flags:
  winning-escape: { bank: flag_bytes, index: 8, mask: 16 } # Flag 68.
  aborted-clone-launch: { bank: flag_bytes, index: 14, mask: 8 } # Flag 115. Logic 86 awards points, sets the flag and writes variable 144 = 2.
  entered-sleep-chamber: { bank: flag_bytes, index: 24, mask: 32 } # Flag 197. Logic 93 awards points for using the chamber.
milestones:
  - id: labion-landing
    label: "Reached the shuttle on Labion"
    when: { room: labion-landing }
  - id: approached-asteroid
    label: Approached Vohaul’s asteroid
    when: { room: asteroid-approach }
  - id: reached-clone-controls
    label: Reached the clone launch controls
    when: { room: clone-launch-controls }
  - id: vohaul-jar
    label: "Reached the inside of Vohaul’s jar"
    when: { room: vohaul-jar }
  - id: aborted-clone-launch
    label: "Stopped the clone launch"
    when: { flag: aborted-clone-launch }
  - id: entered-sleep-chamber
    label: "Entered the escape pod’s sleep chamber"
    when: { flag: entered-sleep-chamber }
  - id: winning-ending
    label: Escaped Vohaul and stopped the clone launch
    when:
      all:
        - { room: epilogue }
        - { flag: winning-escape }
