# English DOS CD 1.01.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/lsl7-dos-1.01/src
# ro130 welcomes Larry aboard. ro240 introduces the competition.
# ro222 starts the sail-away ending in room 150.
# ro150 proceeds to 151 or 152 depending on the optional Easter egg requirements.
schema_version: 1
game: leisure-suit-larry-7-love-for-sail
engine_id: sci
edition:
  game_id: lsl7
  index_md5: 63fe61e2fa7b019d5e202045e6a29d24
telemetry: snapshot
scoring: highest_stage
rooms:
  ship-boarding: 130
  competition-theater: 240
  competition-finale: 222
  sail-away: 150
  ordinary-credits: 151
  bonus-credits: 152
variables:
  previous-room: { bank: globals, index: 12 }
milestones:
  - id: boarded-ship
    label: Boarded the PMS Bouncy
    when: { room: ship-boarding }
  - id: reached-competition
    label: Reached the competition theater
    when: { room: competition-theater }
  - id: competition-finale
    label: Reached the Captain’s competition finale
    when: { room: competition-finale }
  - id: sailed-away
    label: Sailed away with Captain Thygh
    when: { room: sail-away }
  - id: winning-ending
    label: Completed the Captain’s competition
    when: { all: [{ any: [{ room: ordinary-credits }, { room: bonus-credits }] }, { variable: previous-room, equals: 150 }] }
