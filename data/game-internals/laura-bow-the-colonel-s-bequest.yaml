    when: { variable: investigation-act, equals: 4 }
  - id: reached-act-6
    label: Reached act 6
    when: { variable: investigation-act, equals: 5 }
  - id: reached-act-7
    label: Reached act 7
    when: { variable: investigation-act, equals: 6 }
  - id: reached-act-8
    label: Reached act 8
    when: { variable: investigation-act, equals: 7 }
  - id: departure-after-case
    label: "Reached the resolved-case epilogue"
    when: { room: departure-after-case }
