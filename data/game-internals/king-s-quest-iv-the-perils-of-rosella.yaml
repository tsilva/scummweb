# English Amiga SCI 1.023.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/kq4-amiga-1.023/src
# Room 694 also plays the ending where Graham dies. Only its healing-fruit
# branch resets the in-game hour to 0, at state 111 after Graham recovers.
schema_version: 1
game: king-s-quest-iv-the-perils-of-rosella
engine_id: sci
edition:
  game_id: kq4sci
  index_md5: 53cceea993dc02611cc3cfb3f1c548bb
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  castle-ending: 694
  cottage-kitchen: 54 # Script 22 opens the cottage door; script 54 runs the cleaning sequence.
  lolotte-castle-hall: 86 # Script 86 handles the dungeon and throne-room doors.
variables:
  score: { bank: globals, index: 15 }
  game-hour: { bank: globals, index: 160 }
  lolotte-alive: { bank: globals, index: 169 } # Room82 sets 0 after the arrow.
  quest-stage: { bank: globals, index: 109 } # gAct, Room92.
  cleaned-cottage: { bank: globals, index: 102 } # Room54
  chopped-tree: { bank: globals, index: 112 } # sForReg
  opened-library-passage: { bank: globals, index: 131 } # Room67
  wore-crown: { bank: globals, index: 200 } # Room24
  called-dolphin: { bank: globals, index: 217 } # Room43
  charmed-snake: { bank: globals, index: 155 } # Room78
  hit-unicorn: { bank: globals, index: 191 } # regUnicorn
  delivered-unicorn: { bank: globals, index: 123 } # Room92/Room94
  found-pandoras-box: { bank: globals, index: 218 } # Room69
  unlocked-lolottes-door: { bank: globals, index: 220 } # Room82
milestones:
  - id: cottage-kitchen
    label: "Entered the dwarfs’ cottage"
    when: { any: [{ room: cottage-kitchen }, { variable: cleaned-cottage, one_of: [1, 2] }] }
  - id: lolotte-castle-hall
    label: "Reached Lolotte’s castle hall"
    when: { room: lolotte-castle-hall }
  - id: cleaned-cottage
    label: Cleaned the dwarfs’ cottage
    when: { variable: cleaned-cottage, one_of: [1, 2] }
  - id: chopped-tree
    label: Chopped down the tree with the axe
    when: { variable: chopped-tree, equals: 1 }
  - id: opened-library-passage
    label: Opened the secret library passage
    when: { variable: opened-library-passage, equals: 1 }
  - id: wore-crown
    label: Used the crown to turn into a frog
    when: { variable: wore-crown, equals: 1 }
  - id: called-dolphin
    label: Called the dolphin with the silver whistle
    when: { variable: called-dolphin, equals: 1 }
  - id: charmed-snake
    label: Charmed the snake with the silver flute
    when: { variable: charmed-snake, equals: 1 }
  - id: hit-unicorn
    label: Used Cupid’s bow on the unicorn
    when: { variable: hit-unicorn, equals: 1 }
  - id: delivered-unicorn
    label: Brought the unicorn to Lolotte
    when: { variable: delivered-unicorn, one_of: [99, 999] }
  - id: found-pandoras-box
    label: Found Pandora’s box in the crypt
    when: { variable: found-pandoras-box, equals: 1 }
  - id: unlocked-lolottes-door
    label: Unlocked Lolotte’s door
    when: { variable: unlocked-lolottes-door, equals: 1 }
  - id: delivered-hen
    label: Brought the magic hen to Lolotte
    when: { variable: quest-stage, one_of: [3, 99] }
  - id: delivered-pandoras-box
    label: Brought Pandora’s box to Lolotte
    when: { variable: quest-stage, equals: 99 }
  - id: defeated-lolotte
    label: Defeated Lolotte with Cupid’s arrow
    when: { all: [{ variable: lolotte-alive, equals: 0 }, { variable: unlocked-lolottes-door, equals: 1 }] }
  - id: returned-to-daventry
    label: Returned to Daventry
    when: { room: castle-ending }
  - id: winning-ending
    label: Healed King Graham
    when:
      all:
        - { room: castle-ending }
        - { variable: game-hour, equals: 0 }
