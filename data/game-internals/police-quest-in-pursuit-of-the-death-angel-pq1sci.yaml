# English DOS SCI remake 2.000.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/pq1-dos-2.000/src
# Room 200 is the shared death handler. Room 60 is the award ceremony after defeating Bains in room 58.
schema_version: 1
game: police-quest-in-pursuit-of-the-death-angel-pq1sci
engine_id: sci
edition:
  game_id: pq1sci
  index_md5: 1bddd987b230086a13da172f85908d2c
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  bains-confrontation: 58
  award-ceremony: 60
  game-over: 200
  felony-stop: 43 # Script 43 runs the stop, contact, and rights sequences.
  hotel-delphoria: 50 # Script 50 sets up the hotel doors and driveway.
variables:
  score: { bank: globals, index: 15 }
  previous-room: { bank: globals, index: 12 }
flags:
  # Saved LSB-first SetScore awards in Main.sc.
  got-memo: { bank: globals, index: 140, mask: 0x4000 } # 110, rm015
  completed-memo: { bank: globals, index: 141, mask: 0x0008 } # 115, rm012/rm016
  took-hoffman-file: { bank: globals, index: 141, mask: 0x0400 } # 122, lookAtFileCabinet
  got-key: { bank: globals, index: 141, mask: 0x2000 } # 125, rm021
  issued-ticket: { bank: globals, index: 143, mask: 0x0008 } # 147, rm041
  tested-driver: { bank: globals, index: 143, mask: 0x0020 } # 149, rm042
  read-rights: { bank: globals, index: 143, mask: 0x2000 } # 157, rm043
  inspected-trunk: { bank: globals, index: 144, mask: 0x0002 } # 161, rm043
  presented-warrant: { bank: globals, index: 144, mask: 0x0200 } # 169, rm35
  removed-suspects-cuffs: { bank: globals, index: 144, mask: 0x0400 } # 170, rm35
  obtained-warrant: { bank: globals, index: 144, mask: 0x2000 } # 173, rm067
  cuffed-suspect: { bank: globals, index: 144, mask: 0x8000 } # 175, rm46
  searched-suspect: { bank: globals, index: 145, mask: 0x0002 } # 177, rm46
  interrogated-suspect: { bank: globals, index: 145, mask: 0x0004 } # 178, rm45
  made-hotel-call: { bank: globals, index: 146, mask: 0x0020 } # 197, rm54
  used-pen: { bank: globals, index: 146, mask: 0x0040 } # 198, rm58
milestones:
  - id: felony-stop
    label: "Reached the felony stop"
    when: { room: felony-stop }
  - id: hotel-delphoria
    label: "Reached the Hotel Delphoria"
    when: { room: hotel-delphoria }
  - id: confronted-bains
    label: Reached the confrontation with Bains
    when: { room: bains-confrontation }
  - id: got-memo
    label: Collected the memo
    when: { flag: got-memo }
  - id: completed-memo
    label: Completed the memo procedure
    when: { flag: completed-memo }
  - id: took-hoffman-file
    label: Took Hoffman’s file
    when: { flag: took-hoffman-file }
  - id: got-key
    label: Collected the key
    when: { flag: got-key }
  - id: issued-ticket
    label: Issued Helen a ticket
    when: { flag: issued-ticket }
  - id: tested-driver
    label: Gave the drunk driver a sobriety test
    when: { flag: tested-driver }
  - id: read-rights
    label: Read the felony suspect his Miranda rights
    when: { flag: read-rights }
  - id: inspected-trunk
    label: Found the drugs in the trunk
    when: { flag: inspected-trunk }
  - id: presented-warrant
    label: Presented the warrant
    when: { flag: presented-warrant }
  - id: removed-suspects-cuffs
    label: Removed the suspect’s handcuffs at booking
    when: { flag: removed-suspects-cuffs }
  - id: obtained-warrant
    label: Obtained the warrant
    when: { flag: obtained-warrant }
  - id: cuffed-suspect
    label: Handcuffed the suspect at the park
    when: { flag: cuffed-suspect }
  - id: searched-suspect
    label: Frisked the suspect at the park
    when: { flag: searched-suspect }
  - id: interrogated-suspect
    label: Interrogated the suspect
    when: { flag: interrogated-suspect }
  - id: made-hotel-call
    label: Made the hotel phone call
    when: { flag: made-hotel-call }
  - id: used-pen
    label: Used the transmitter pen
    when: { flag: used-pen }
  - id: winning-ending
    label: Defeated Bains and received the award
    when:
      all:
        - { room: award-ceremony }
        - { variable: previous-room, equals: 58 }
