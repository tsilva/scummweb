# English DOS CD 2.00b.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/kq7-dos-2.00b/src
# The grand finale advances from room 2208 to room 2210. Volcano and Malicia failures can occur earlier.
schema_version: 1
game: king-s-quest-vii-the-princeless-bride
engine_id: sci
edition:
  game_id: kq7
  index_md5: a000858d91155b948bf3b23fa71ff79a
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  chapter-transition: 35
  grand-finale: 2208
  royal-ending: 2210
  etheria-gate: 5400
variables:
  chapter: { bank: globals, index: 122 } # One-based during play, zero-based in the selection menu.
  previous-room: { bank: globals, index: 12 }
flags:
  # ExitButton.sc stores numbered flags most-significant bit first.
  # These flags are not preloaded by the chapter-selection routine in kqChapCode.sc.
  gila-comb: { bank: globals, index: 160, mask: 0x0400 } # Flag 533, rm1000.
  enchanted-rope: { bank: globals, index: 131, mask: 0x0200 } # Flag 70, rm2550.
  reached-etheria: { bank: globals, index: 139, mask: 0x0010 } # Flag 203, rm6200.
milestones:
  # Room 35 also opens from the chapter menu (room 20); require the actual scene.
  - id: reached-chapter-2
    label: Recovered the golden comb and completed chapter 1
    when: { flag: gila-comb }
  - id: used-enchanted-rope
    label: Used the enchanted rope to reach the bucket
    when: { flag: enchanted-rope }
  - id: reached-chapter-3
    label: Completed chapter 2 in play
    implies: [used-enchanted-rope]
    when: { all: [{ room: chapter-transition }, { variable: previous-room, equals: 2550 }, { variable: chapter, equals: 2 }] }
  - id: reached-chapter-4
    label: Completed chapter 3 in play
    when: { all: [{ room: chapter-transition }, { variable: previous-room, equals: 5300 }, { variable: chapter, equals: 3 }] }
  - id: reached-chapter-5
    label: Completed chapter 4 in play
    when: { all: [{ room: chapter-transition }, { variable: previous-room, equals: 2202 }, { variable: chapter, equals: 4 }] }
  - id: reached-etheria-gate
    label: Reached the gate to Etheria
    when: { room: etheria-gate }
  - id: reached-etheria
    label: Reached Etheria
    when: { flag: reached-etheria }
  - id: reached-chapter-6
    label: Completed chapter 5 in play
    when: { all: [{ room: chapter-transition }, { variable: previous-room, equals: 6010 }, { variable: chapter, equals: 5 }] }
  - id: reached-grand-finale
    label: Reached the grand finale
    when: { room: grand-finale }
  - id: winning-ending
    label: Reached the royal ending
    implies: [reached-grand-finale]
    when: { all: [{ room: royal-ending }, { variable: previous-room, equals: 2208 }] }
