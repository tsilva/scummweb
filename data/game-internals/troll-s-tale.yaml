# English PC-booter floppy.
# Engine reference: https://github.com/scummvm/scummvm/blob/7d2709da5136866589f7602f5f5a7b17de03420e/engines/agi/preagi/troll.cpp
# The interpreter counts down from 16 treasures. It unlocks the return route at zero.
# The final action ends the game loop. Quitting the game does not pass through the ending.
