  read-malias-note: { bank: globals, index: 151, mask: 0x0400 } # 389, bookstore
  took-harts-notes: { bank: globals, index: 153, mask: 0x0200 } # 422, rm340
  opened-register: { bank: globals, index: 134, mask: 0x0020 } # 122, bookstore
  opened-drawer: { bank: globals, index: 135, mask: 0x0100 } # 135, rm391
  collected-clay: { bank: globals, index: 135, mask: 0x8000 } # 128, rm470
  collected-scissors: { bank: globals, index: 138, mask: 0x0800 } # 180, rm530
  collected-pot: { bank: globals, index: 138, mask: 0x0400 } # 181, rm530
  collected-scroll: { bank: globals, index: 138, mask: 0x0200 } # 182, rm530
  opened-initiation-door: { bank: globals, index: 138, mask: 0x0100 } # 183, rm530
  examined-initiation-panels: { bank: globals, index: 154, mask: 0x0020 } # 442, rm540
  read-ceremonial-table: { bank: globals, index: 154, mask: 0x0002 } # 446, sCeremonialRoom
