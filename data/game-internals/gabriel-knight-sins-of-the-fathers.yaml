  - id: germany
    label: "Arrived in Germany"
    when: { room: germany }
  - id: voodoo-ceremony
    label: "Reached the ceremony"
    when: { room: voodoo-ceremony }
  - id: hounfour-finale
    label: "Reached the Hounfour finale"
    when: { room: hounfour-finale }
  - id: read-malias-note
    label: Read Malia’s note
    when: { flag: read-malias-note }
  - id: took-harts-notes
    label: Collected Hart’s notes
    when: { flag: took-harts-notes }
  - id: opened-register
    label: Opened the bookstore register
    when: { flag: opened-register }
  - id: opened-drawer
    label: Opened the drawer
    when: { flag: opened-drawer }
  - id: collected-clay
    label: Collected the clay
    when: { flag: collected-clay }
  - id: collected-scissors
    label: Collected the scissors
    when: { flag: collected-scissors }
  - id: collected-pot
    label: Collected the pot
    when: { flag: collected-pot }
  - id: collected-scroll
    label: Collected the scroll
    when: { flag: collected-scroll }
  - id: opened-initiation-door
    label: Opened the initiation room door
    when: { flag: opened-initiation-door }
  - id: examined-initiation-panels
    label: Examined the initiation panels
    when: { flag: examined-initiation-panels }
  - id: read-ceremonial-table
    label: Read the ceremonial table inscription
    when: { flag: read-ceremonial-table }
