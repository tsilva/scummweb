    when: { flag: primus-key }
  - id: secundus-key
    label: Recovered the Secundus key
    when: { flag: secundus-key }
  - id: tertius-key
    label: Recovered the Tertius key
    when: { flag: tertius-key }
  - id: quartus-key
    label: Recovered the Quartus key
    when: { flag: quartus-key }
  - id: quintus-key
    label: Recovered the Quintus key
    when: { flag: quintus-key }
  - id: sextus-key
    label: Recovered the Sextus key
    when: { flag: sextus-key }
  - id: recovered-spellbook
    label: Recovered the spell recipe book
    when: { flag: recovered-spellbook }
  - id: recovered-crossbow
    label: Recovered the crossbow
    when: { flag: recovered-crossbow }
  - id: recovered-salt
    label: Recovered the salt for the kitchen
    when: { flag: recovered-salt }
  - id: recovered-elviras-ring
    label: Recovered Elvira’s ring
    when: { flag: recovered-elviras-ring }
  - id: recovered-crusader-sword
    label: Recovered the crusader’s sword
    when: { flag: recovered-crusader-sword }
  - id: recovered-fire-tongs
    label: Recovered the fire tongs
    when: { flag: recovered-fire-tongs }
  - id: recovered-rune-stone
    label: Recovered the rune stone
    when: { flag: recovered-rune-stone }
  - id: unlocked-chest
    label: Unlocked the chest with all six keys
    when: { variable: chest-keys-inserted, equals: 6 }
  - id: recovered-ceremonial-scroll
    label: Recovered the ceremonial scroll
    when: { flag: recovered-ceremonial-scroll }
  - id: recovered-ceremonial-dagger
    label: Recovered the ceremonial dagger
    when: { flag: recovered-ceremonial-dagger }
  - id: unsealed-emeldas-passage
    label: Unsealed the passage to Emelda
    when: { flag: passage-unsealed }
  - id: cast-ceremonial-scroll
    label: Cast the ceremonial scroll against Emelda
    when: { flag: scroll-cast }
  - id: winning-ending
    label: Defeated Emelda
    when: { variable: emelda-defeated, equals: 1 }
