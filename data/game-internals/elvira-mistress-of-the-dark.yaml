  chest-keys-inserted: { bank: vars, index: 139 }
  # True only on the successful branch of dagger subroutine 231.
  emelda-defeated: { bank: elvira1_outcome, key: emelda_defeated }
flags:
  # Subroutine 262 records pickups in the save variables (also used for score).
  # Credit survives dropping an item or using a key in the chest.
  primus-key: { bank: vars, index: 449, mask: 1 }
  secundus-key: { bank: vars, index: 449, mask: 2 }
  tertius-key: { bank: vars, index: 449, mask: 4 }
