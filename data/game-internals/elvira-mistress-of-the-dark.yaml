  recovered-crossbow: { bank: vars, index: 450, mask: 4 }
  recovered-salt: { bank: vars, index: 449, mask: 2048 }
  recovered-elviras-ring: { bank: vars, index: 449, mask: 8192 }
  recovered-crusader-sword: { bank: vars, index: 450, mask: 8 }
  recovered-fire-tongs: { bank: vars, index: 449, mask: 1024 }
  recovered-rune-stone: { bank: vars, index: 449, mask: 512 }
  recovered-ceremonial-scroll: { bank: vars, index: 449, mask: 64 }
  recovered-ceremonial-dagger: { bank: vars, index: 449, mask: 128 }
  passage-unsealed: { bank: vars, index: 435, mask: 2 } # Subroutine 172.
