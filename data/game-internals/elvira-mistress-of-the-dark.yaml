schema_version: 1
game: elvira-mistress-of-the-dark
engine_id: agos
edition:
  game_id: elvira1
  index_md5: 773f0004d21f095c7a4c25d4cd22a1a1
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  emeldas-chamber: 45
  chest-room: 59
