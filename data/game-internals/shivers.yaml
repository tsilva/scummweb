# English Windows CD 1.02.
# Script reference: https://github.com/sluicebox/sci-scripts/tree/870a8015b689474484bf3d8b41416956d4315432/shivers-win-1.02/src
# Script n951 proc951_12 sets each captured Ixupi bit in global104 and increments global547.
# Only the successful ending menu can start the museum tour; flag 87 keeps that win verified.
# rm39v260 enters closingMovie when all ten are captured. Its normal route enters room 923.
schema_version: 1
game: shivers
engine_id: sci
edition:
  game_id: shivers
  index_md5: 5dc3653b80fee5c69f7c850c990cbbcc
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  closing-movie: 935
  ending: 923
variables:
  captured: { bank: globals, index: 547 }
  previous-room: { bank: globals, index: 12 }
flags:
  tour-mode: { bank: globals, index: 214, mask: 0x0100 } # n951 flag 87
  captured-sand: { bank: globals, index: 104, mask: 0x0001 }
  captured-crystal: { bank: globals, index: 104, mask: 0x0002 }
  captured-metal: { bank: globals, index: 104, mask: 0x0004 }
  captured-tar: { bank: globals, index: 104, mask: 0x0008 }
  captured-wood: { bank: globals, index: 104, mask: 0x0010 }
  captured-electric: { bank: globals, index: 104, mask: 0x0020 }
  captured-ash: { bank: globals, index: 104, mask: 0x0040 }
  captured-water: { bank: globals, index: 104, mask: 0x0080 }
  captured-fabric: { bank: globals, index: 104, mask: 0x0100 }
  captured-wax: { bank: globals, index: 104, mask: 0x0200 }
milestones:
  - id: captured-sand
    label: Captured the Sand Ixupi
    when: { flag: captured-sand }
  - id: captured-crystal
    label: Captured the Crystal Ixupi
    when: { flag: captured-crystal }
  - id: captured-metal
    label: Captured the Metal Ixupi
    when: { flag: captured-metal }
  - id: captured-tar
    label: Captured the Tar Ixupi
    when: { flag: captured-tar }
  - id: captured-wood
    label: Captured the Wood Ixupi
    when: { flag: captured-wood }
  - id: captured-electric
    label: Captured the Electric Ixupi
    when: { flag: captured-electric }
  - id: captured-ash
    label: Captured the Ash Ixupi
    when: { flag: captured-ash }
  - id: captured-water
    label: Captured the Water Ixupi
    when: { flag: captured-water }
  - id: captured-fabric
    label: Captured the Fabric Ixupi
    when: { flag: captured-fabric }
  - id: captured-wax
    label: Captured the Wax Ixupi
    when: { flag: captured-wax }
  - id: winning-ending
    label: Finished the museum challenge
    when:
      all:
        - { variable: captured, equals: 10 }
        - any:
            - all:
                - { room: ending }
                - { variable: previous-room, equals: 935 }
            - { flag: tour-mode }
