  cleared-underwater-chamber: { bank: flag_words, index: 7, mask: 512 } # 1329, animation 6300.
  crossed-spider-chasm: { bank: flag_words, index: 5, mask: 2048 } # 1312, thread 686 moves the player across.
  drew-wallet-from-web: { bank: flag_words_secondary, index: 4, mask: 1 } # 327, Telekinesis on item 532.
  defeated-scroll-guardian: { bank: flag_words, index: 6, mask: 256 } # 1329, animation 7300.
  entered-haunted-studio: { bank: flag_words_secondary, index: 0, mask: 64 } # 1088, stage room 685 leads to the house.
  cleared-kitchen-passage: { bank: flag_words, index: 8, mask: 32 } # 335 opens passage 465/466.
  rang-locker-bell: { bank: flag_words_secondary, index: 4, mask: 512 } # 1839.
  uncovered-bedroom-script: { bank: flag_words, index: 12, mask: 8192 } # 1810.
  survived-succubus: { bank: flag_words, index: 13, mask: 32 } # 1139, successful Courage branch.
  researched-demonology: { bank: flag_words, index: 13, mask: 2048 } # 1606, unlocks pentacle dialogue.
  poisoned-tank-fish: { bank: flag_words, index: 11, mask: 16384 } # 1829, checks the meat is poisoned.
  opened-study-safe: { bank: flag_words_secondary, index: 4, mask: 8 } # 1103, grants credit at safe state 0.
  defeated-attic-vampire: { bank: flag_words, index: 13, mask: 2 } # VGA animation 9101 after the skylight breaks.
  installed-lightning-rod: { bank: flag_words_secondary, index: 4, mask: 16 } # 1145, rod 87 present on the roof.
  monster-was-powered: { bank: flag_words, index: 12, mask: 64 } # 1148, set when the monster is animated.
