# English Amiga floppy, ScummVM detector target agos:elvira2.
# ScummWEB hashes the entire gameamiga database for telemetry identity.
# AGOS item IDs include two reserved database entries. Flags and item states
# are serialized by AGOSEngine_Elvira2::saveGame and restored by loadGame.
