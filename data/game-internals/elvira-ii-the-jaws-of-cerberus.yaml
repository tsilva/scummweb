# English Amiga floppy, ScummVM detector target agos:elvira2.
# ScummWEB hashes the entire gameamiga database for telemetry identity.
# AGOS item IDs include two reserved database entries. Flags and item states
# are serialized by AGOSEngine_Elvira2::saveGame and restored by loadGame.
schema_version: 1
game: elvira-ii-the-jaws-of-cerberus
engine_id: agos
edition:
  game_id: elvira2
  index_md5: a144d2467e1addee1f705647dacd33df
telemetry: snapshot
completion_milestone: winning-ending
rooms:
  studio-drive-entrance: 854
  studio-foyer: 836
  ritual-car-park: 822
  crypt: 769
  spider-maze: 744 # Superroom container, not an individual cell.
  tunnels: 760 # Superroom container, not an individual cell.
objects:
  elvira: 11
  magic-bag: 14
  tomahawk: 15
  lance: 593
  bind-demon-spell: 638
  golden-cross: 771
  spellbook: 833
flags:
  # Each set has the same marker on its false-Elvira and rescue branches.
  spider-studio-resolved: { bank: flag_words, index: 7, mask: 2 } # Bit 113; 1329, 1380.
  haunted-studio-resolved: { bank: flag_words, index: 13, mask: 16384 } # Bit 222; 1859, 1150.
  catacombs-studio-resolved: { bank: flag_words, index: 6, mask: 128 } # Bit 103; 1291, 1230.
  recovered-fish-tank-key: { bank: flag_words_secondary, index: 4, mask: 4 } # Bit 66; 1827.
  charged-lab: { bank: flag_words, index: 12, mask: 8 } # Bit 195; 341.
  animated-monster: { bank: flag_words_secondary, index: 5, mask: 32 } # Bit 85; 2210.
  blessed-implements: { bank: flag_words, index: 13, mask: 512 } # Bit 217; 1854.
variables:
  gatehouse-window: { bank: item_states, index: 851 } # Verb 227 in subroutine 0.
  gatehouse-security-key: { bank: item_states, index: 802 } # Inserted by verb 500 in subroutine 0.
  boiler-room: { bank: item_states, index: 823 } # Fire spell subroutines 313 and 317.
  attic-skylight: { bank: item_states, index: 367 } # Tuning fork in subroutine 0.
  church-pulpit: { bank: item_states, index: 774 } # Verb 500 in subroutine 0.
  church-priest: { bank: item_states, index: 176 } # 338 resurrects; 1856 dispatches to the pentacle.
  # AGOSEngine_Elvira2::printStats reads these four slots directly.
  level: { bank: vars, index: 20 }
  experience: { bank: vars, index: 21 }
  power-points: { bank: vars, index: 22 }
  hit-points: { bank: vars, index: 23 }
  # Subroutines 105 and 106 select Stuntman (0), Private Eye (1),
  # Computer Programmer (2), or Knife Thrower (3). The restore prompt uses 4.
  character-class: { bank: vars, index: 102 }
  # Subroutines 1859, 1291 and 1329 count the first two studio outcomes.
  # The rescue branches in 1150, 1230 and 1380 set 3 and place Elvira with the player.
  studio-outcomes: { bank: vars, index: 180 }
  # Subroutines 1864 and 339 set 1 (summoned) and 2 (bound). The lance
  # action in subroutine 0 sets 3. Subroutines 1862 and 1865 use 10 and 20.
  ritual-stage: { bank: vars, index: 186 }
  # ScummWEB records entry into the winning script (1) or ritual failure (2).
  # The result survives the scripted Start load and resets on a new attempt.
  ritual-outcome: { bank: elvira2_outcome, key: ritual }
milestones:
  - id: broke-gatehouse-window
    label: Broke the gatehouse window
    when: { variable: gatehouse-window, one_of: [1, 2] }
  - id: inserted-security-key
    label: Inserted the gatehouse security key
    when: { variable: gatehouse-security-key, equals: 1 }
  - id: thawed-boiler-room
    label: Thawed the boiler room
    when: { variable: boiler-room, equals: 1 }
  - id: opened-attic-skylight
    label: Opened the attic skylight with the tuning fork
    when: { variable: attic-skylight, equals: 1 }
  - id: recovered-fish-tank-key
    label: Recovered the key from the fish tank
    when: { flag: recovered-fish-tank-key }
  - id: charged-lab
    label: Sent lightning to the laboratory
    when: { flag: charged-lab }
  - id: animated-monster
    label: Brought the laboratory monster to life
    when: { flag: animated-monster }
  - id: exposed-church-trapdoor
    label: Moved the church pulpit to expose the trapdoor
    when: { variable: church-pulpit, equals: 1 }
  - id: resolved-spider-studio
    label: Resolved the spider caves studio
    when: { flag: spider-studio-resolved }
  - id: resolved-haunted-studio
    label: Resolved the haunted house studio
    when: { flag: haunted-studio-resolved }
  - id: resolved-catacombs-studio
    label: Resolved the catacombs studio
    when: { flag: catacombs-studio-resolved }
  - id: rescued-elvira
    label: Rescued Elvira
    when: { variable: studio-outcomes, equals: 3 }
  - id: revived-priest
    label: Revived the priest
    when: { variable: church-priest, one_of: [1, 2] }
  - id: prepared-pentacle
    label: Had the priest prepare the pentacle
    when: { variable: church-priest, equals: 2 }
  - id: blessed-implements
    label: Had the ritual implements blessed
    when: { flag: blessed-implements }
  - id: summoned-cerberus
    label: Summoned Cerberus at the car park
    when:
      all:
        - { milestone: rescued-elvira }
        - { variable: ritual-stage, one_of: [1, 2, 3] }
  - id: bound-cerberus
    label: Bound Cerberus
    when:
      all:
        - { milestone: summoned-cerberus }
        - { variable: ritual-stage, one_of: [2, 3] }
  - id: used-lance
    label: Used the lance on Cerberus
    when:
      all:
        - { milestone: bound-cerberus }
        - { variable: ritual-stage, equals: 3 }
  - id: winning-ending
    label: Triggered the winning ending
    # 1882 reloads Start. The outcome remains valid after vars are reset.
    when: { variable: ritual-outcome, equals: 1 }
